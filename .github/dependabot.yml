version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/apps/connector-worker"
    schedule:
      interval: weekly