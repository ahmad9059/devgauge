name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_SPIKE_TEST: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install npm
        run: npm install -g npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Type checking, lint, tests, and configuration
        run: npm run check
      - name: Formatting
        run: npm run format:check
      - name: Validate dependency audit policy
        run: npm run audit:policy-test
      - name: Audit dependencies
        run: npm run audit:deps
      - name: Expo dependency compatibility
        run: npx expo install --check
      - name: Export production Android bundle
        run: npx expo export --platform android --output-dir /tmp/devgauge-ci-export
