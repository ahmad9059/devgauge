# Local development services only. Staging/production are provisioned by
# infrastructure-as-code on Fly.io + Neon + managed Redis (see ADR-0004).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devgauge
      POSTGRES_PASSWORD: devgauge
      POSTGRES_DB: devgauge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devgauge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: devgauge
      MINIO_ROOT_PASSWORD: devgauge-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 devgauge devgauge-secret &&
      mc mb --ignore-existing local/devgauge &&
      echo 'bucket devgauge ready'
      "

volumes:
  postgres_data:
  redis_data:
  minio_data: